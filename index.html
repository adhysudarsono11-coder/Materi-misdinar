<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentasi Rekoleksi Misdinar & OMK</title>

  <style>
    :root {
      --navy: #0f172a;
      --navy-card: #1e293b;
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.15);
      --ivory: #f8fafc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--navy);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* Progress Bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 5px;
      background: linear-gradient(90deg, #ca8a04, #facc15);
      transition: width 0.4s ease;
      z-index: 100;
    }

    /* Slide Container */
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 4rem 6rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.98);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    /* Typography */
    .kicker {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kicker::before {
      content: "";
      display: inline-block;
      width: 32px;
      height: 3px;
      background-color: var(--gold);
      border-radius: 2px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      line-height: 1.15;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    h2 {
      font-size: clamp(2rem, 3.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 2.5rem;
      color: #ffffff;
    }
